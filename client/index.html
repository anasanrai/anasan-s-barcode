    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      try {
        var t = localStorage.getItem("hungertag-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        var l = localStorage.getItem("hungertag-lang");
        if (!l) { l = (navigator.language || "").toLowerCase().startsWith("ar") ? "ar" : "en"; }
        if (l === "ar") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
      } catch(e) {}
      window.__deferredPrompt = null;
      window.addEventListener("beforeinstallprompt", function(e) {
        e.preventDefault();
        window.__deferredPrompt = e;
        window.dispatchEvent(new CustomEvent("app-prompt-ready"));
      });
    </script>
    <title>HungerStation Barcode — Barcode & QR Generator</title>
